# === FILL IN YOUR OWN VALUES (from the SonarCloud UI) ===
# Create an organization and a project at https://sonarcloud.io,
# then copy the project key and organization key here.
sonar.projectKey=<your-project-key>
sonar.organization=<your-organization>

sonar.host.url=https://sonarcloud.io

# === Analysis scope (already configured — explained during training) ===
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.junit.reportPaths=target/surefire-reports

# Full analysis exclusion (files are ignored by the Sonar analyzers)
sonar.exclusions=src/main/java/com/example/demo/model/**

# Coverage-only exclusion (file is analyzed but excluded from coverage)
sonar.coverage.exclusions=src/main/java/com/example/demo/DemoApplication.java
